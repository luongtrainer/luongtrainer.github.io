<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Từ Đường Kisato · Mã kết nối TikTok</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0E1037;color:#fff;
       font-family:system-ui,"Segoe UI",Roboto,sans-serif;padding:24px}
  .hop{width:min(560px,100%);background:#161a45;border:1px solid #2f3270;border-radius:16px;padding:28px}
  h1{margin:0 0 6px;font-size:1.25rem;color:#F8B030}
  p{margin:0 0 16px;color:#b9c0e4;line-height:1.5}
  code{display:block;background:#0b0d2a;border:1px solid #2f3270;border-radius:10px;padding:14px;
       word-break:break-all;font-size:1rem;color:#fff;margin-bottom:14px}
  button{background:#F8B030;border:0;border-radius:999px;padding:10px 22px;font-weight:700;
         color:#0E1037;cursor:pointer;font-size:1rem}
  button:hover{filter:brightness(1.1)}
  .loi{color:#ff9aa6}
</style>
</head>
<body>
<div class="hop">
  <h1>Mã kết nối TikTok</h1>
  <p id="nhac">Chép mã dưới đây rồi dán vào Kisato Video Studio → Kết nối → TikTok → ô “Mã lấy từ trang trả về”.</p>
  <code id="ma">…</code>
  <button id="chep">Chép mã</button>
</div>
<script>
  // Trang này KHÔNG gửi mã đi đâu cả. Nó chỉ đọc mã trên thanh địa chỉ và hiện ra để chép tay.
  // Mã chỉ dùng được một lần và hết hạn trong ít phút.
  const q = new URLSearchParams(location.search);
  const ma = q.get('code');
  const loi = q.get('error') || q.get('error_description');
  const o = document.getElementById('ma');
  if (ma) {
    o.textContent = ma;
  } else {
    o.textContent = loi ? 'TikTok báo lỗi: ' + loi : 'Không thấy mã trên địa chỉ.';
    o.classList.add('loi');
    document.getElementById('nhac').textContent = 'Quay lại Studio và bấm “Mở trang cấp quyền TikTok” lần nữa.';
    document.getElementById('chep').style.display = 'none';
  }
  document.getElementById('chep').onclick = async () => {
    try { await navigator.clipboard.writeText(ma || ''); document.getElementById('chep').textContent = 'Đã chép ✓'; }
    catch { getSelection().selectAllChildren(o); }
  };
</script>
</body>
</html>
